{% extends "base.html" %}
{% block title %}Register — NoteShare{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo" aria-hidden="true">📚</div>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Join your semester's notes &amp; discussions</p>
        </div>

        <div id="error-msg" class="alert alert-danger" role="alert" style="display: none;"></div>
        <div id="success-msg" class="alert alert-success" role="status" style="display: none;"></div>

        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="">Select your semester</option>
                    {% for s in semesters %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="register-btn">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errMsg = document.getElementById('error-msg');
    const sucMsg = document.getElementById('success-msg');
    const btn = document.getElementById('register-btn');
    errMsg.style.display = 'none';
    sucMsg.style.display = 'none';
    btn.disabled = true;

    const data = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        semester: document.getElementById('semester').value
    };

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
            sucMsg.textContent = 'Account created! Redirecting to sign in...';
            sucMsg.style.display = 'block';
            setTimeout(() => window.location.href = '/login', 1200);
        } else {
            errMsg.textContent = result.error || 'Registration failed';
            errMsg.style.display = 'block';
            btn.disabled = false;
        }
    } catch (err) {
        errMsg.textContent = 'Network error. Please try again.';
        errMsg.style.display = 'block';
        btn.disabled = false;
    }
});
</script>
{% endblock %}
