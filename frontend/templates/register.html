{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; background: #1a1d27; border: 1px solid #2a2d3e; border-radius: 10px;">
    <h2 style="text-align: center; color: #e8eaf6;">Create Account</h2>
    
    <div id="error-msg" style="color: red; display: none; margin-bottom: 10px;"></div>
    <div id="success-msg" style="color: green; display: none; margin-bottom: 10px;"></div>
    
    <form id="register-form">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #7b82a4;">Email</label>
            <input type="email" id="email" placeholder="your@email.com" required 
                   style="width: 100%; padding: 10px; background: #12151f; border: 1px solid #2a2d3e; color: #e8eaf6; border-radius: 6px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #7b82a4;">Password</label>
            <input type="password" id="password" placeholder="Min 6 chars" required minlength="6"
                   style="width: 100%; padding: 10px; background: #12151f; border: 1px solid #2a2d3e; color: #e8eaf6; border-radius: 6px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #7b82a4;">Semester</label>
            <select id="semester" required style="width: 100%; padding: 10px; background: #12151f; border: 1px solid #2a2d3e; color: #e8eaf6; border-radius: 6px;">
                <option value="">Select</option>
                <option value="Semester 1">Semester 1</option>
                <option value="Semester 2">Semester 2</option>
                <option value="Semester 3">Semester 3</option>
                <option value="Semester 4">Semester 4</option>
            </select>
        </div>
        
        <button type="submit" style="width: 100%; padding: 10px; background: #4f6ef7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Create Account
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 15px; color: #7b82a4;">
        Have account? <a href="/login" style="color: #4f6ef7; text-decoration: none;">Sign in</a>
    </p>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errMsg = document.getElementById('error-msg');
    const sucMsg = document.getElementById('success-msg');
    errMsg.style.display = 'none';
    sucMsg.style.display = 'none';
    
    const data = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        semester: document.getElementById('semester').value,
        role: 'student'
    };
    
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
            sucMsg.textContent = 'Account created! Redirecting...';
            sucMsg.style.display = 'block';
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            errMsg.textContent = result.error || 'Registration failed';
            errMsg.style.display = 'block';
        }
    } catch (err) {
        errMsg.textContent = 'Error: ' + err.message;
        errMsg.style.display = 'block';
    }
});
</script>
{% endblock %}
