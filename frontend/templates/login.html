{% extends "base.html" %}
{% block title %}Login — NoteShare{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo" aria-hidden="true">📚</div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to access your course notes</p>
        </div>

        <div id="error-msg" class="alert alert-danger" role="alert" style="display: none;"></div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
        </form>

        <p class="auth-switch">No account? <a href="/register">Register</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errMsg = document.getElementById('error-msg');
    const btn = document.getElementById('login-btn');
    errMsg.style.display = 'none';
    btn.disabled = true;

    const data = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
    };

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
            window.location.href = '/dashboard';
        } else {
            errMsg.textContent = result.error || 'Login failed';
            errMsg.style.display = 'block';
            btn.disabled = false;
        }
    } catch (err) {
        errMsg.textContent = 'Network error. Please try again.';
        errMsg.style.display = 'block';
        btn.disabled = false;
    }
});
</script>
{% endblock %}
